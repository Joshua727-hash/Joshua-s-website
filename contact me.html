<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua M Livingstone | Home</title>
    <style>

        /* Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow: hidden; /* Keeps ambient particles inside viewport bounds */
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        /* --- Ambient Particle Background Keyframes --- */
        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.4) 0%, rgba(244, 63, 94, 0) 70%);
            border-radius: 50%;
            animation: floatUp 12s infinite linear;
        }

            /* Generate individual particle paths & delays */
            .particle:nth-child(1) {
                left: 10%;
                width: 80px;
                height: 80px;
                animation-duration: 14s;
                animation-delay: 0s;
            }

            .particle:nth-child(2) {
                left: 30%;
                width: 120px;
                height: 120px;
                animation-duration: 18s;
                animation-delay: 3s;
            }

            .particle:nth-child(3) {
                left: 55%;
                width: 60px;
                height: 60px;
                animation-duration: 11s;
                animation-delay: 1s;
            }

            .particle:nth-child(4) {
                left: 75%;
                width: 100px;
                height: 100px;
                animation-duration: 16s;
                animation-delay: 5s;
            }

            .particle:nth-child(5) {
                left: 90%;
                width: 70px;
                height: 70px;
                animation-duration: 13s;
                animation-delay: 2s;
            }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Profile Layout Container */
        .profile-container {
            background-color: rgba(30, 41, 59, 0.75); /* Translucent to blend with animation */
            backdrop-filter: blur(12px); /* Frosted-glass filter effect */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 63, 94, 0.15);
            padding: 3rem 2rem;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 10; /* Layers card neatly above the drifting particles */
            position: relative;
        }

        /* Profile Image Styling */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #f43f5e;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }

        /* Typography */
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .welcome-msg {
            color: #10b981;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 1.5rem 0 1rem;
            background-color: #0f172a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: inline-block;
        }

        /* Social Icons Styles */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0 1.5rem;
        }

        .social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: #94a3b8;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
        }

            .social-icon svg {
                width: 32px;
                height: 32px;
                fill: currentColor;
            }

            .social-icon:hover {
                color: #f43f5e;
                transform: scale(1.15);
                filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.6));
            }

        /* Contact Me Section Styles */
        .contact-box {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-label {
            display: block;
            font-size: 0.8rem;
            color: #f43f5e;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .contact-email {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            font-family: monospace;
            transition: color 0.2s;
        }

            .contact-email:hover {
                color: #f43f5e;
            }

        /* Modern Navigation Button */
        .nav-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(to right, #f43f5e, #fb7185);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%; /* Spans full internal container size beautifully */
        }

            .nav-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4);
            }
    </style>
</head>
